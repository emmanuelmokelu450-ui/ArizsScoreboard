<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>Basketball Scoreboard</title>
</head>

<link rel="stylesheet"href="style.css">

<body>
    <header></header>
    <h1>BASKETBALL SCOREBOARD</h1>
    <P>Click the buttons to add points</P>

    <div class = "team-container">
        <section class = "team-card"
        
        <h2>HOME</h2>
        <div class ="score" id="home-score" aria-live="polite"> 0

        </div>
    <div class="buttons">
        <button type="button" data-team="home" data-points="1" >+1</button>
    <button type="button" data-team="home" data points="2" >+2</button>
        <button type="button" data-team="home" data-points="3" >+3</button>
    </div>
</section>

<section class = "team-card"
        
        <h1>GUEST</h1>
        <div class ="score" id="guest-score" aria-live="polite"> 0
        </div>
    <div class="buttons">
        <button type="button" data-team="guest" data-points="1">+1</button>
    <button type="button" data-team="guest" data points="2" >+2</button>
        <button type="button" data-team="guest" data-points="3" >+3</button>
    </div>
</section>
<button type="button" id="reset-button" >Reset</button>
<script src="script.js"></script>
</body>
</html>
